version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ./bin/rails server -b 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_NAME: amosup_billing_development
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      BUNDLE_PATH: /usr/local/bundle
    depends_on:
      - db
    volumes:
      - .:/rails:cached
      - bundle_cache:/usr/local/bundle

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: amosup_billing_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  bundle_cache:
